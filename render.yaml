services:
  # Akhyana Web & API Server
  - type: web
    name: akhyana-server
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run migrate && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: akhyana-postgres
          property: connectionString
      - key: CATBOX_USERHASH
        sync: false
      - key: CORS_ORIGIN
        value: https://akhyana.netlify.app

databases:
  # Managed PostgreSQL Database for Akhyana
  - name: akhyana-postgres
    databaseName: akhyana
    user: akhyana_user
    plan: free
    region: oregon
    postgresMajorVersion: 16
