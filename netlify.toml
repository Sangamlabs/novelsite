[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Production backend proxy for Netlify:
# Routes all /api/* requests directly to Render production backend
[[redirects]]
  from = "/api/*"
  to = "https://novelsite.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback rewrite
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
