[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Optional backend proxy for split deployment:
# If deploying frontend to Netlify and backend to Render,
# set BACKEND_URL in Netlify environment variables or uncomment below:
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-render-service.onrender.com/api/:splat"
#   status = 200
#   force = true

# SPA fallback rewrite
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
